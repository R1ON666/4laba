{% for b in books %}
<tr>
  <td class="fw-semibold">{{ b.title }}</td>
  <td>{{ b.author }}</td>
  <td>{{ b.year }}</td>
  <td class="text-nowrap">{{ b.isbn }}</td>
  <td>{{ b.genre }}</td>
  <td>{{ b.pages }}</td>
  <td class="text-nowrap text-end">
    <a class="btn btn-sm btn-outline-primary" href="{% url 'book_edit' b.pk %}">Изменить</a>
    <button type="button" class="btn btn-sm btn-outline-danger"
            data-delete-url="{% url 'book_delete' b.pk %}" data-title="{{ b.title }}">Удалить</button>
  </td>
</tr>
{% empty %}
<tr><td colspan="7" class="text-center text-muted py-4">Ничего не найдено</td></tr>
{% endfor %}
