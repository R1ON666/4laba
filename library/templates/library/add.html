{% extends "library/base.html" %}
{% block title %}Добавить книгу{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Добавить книгу</h1>
<div class="card shadow-sm"><div class="card-body">
  <form method="post" novalidate>
    {% csrf_token %}
    {% for error in form.non_field_errors %}<div class="alert alert-danger">{{ error }}</div>{% endfor %}
    {% for field in form %}{% include "library/_field.html" %}{% endfor %}
    <button type="submit" class="btn btn-primary">Сохранить</button>
  </form>
</div></div>
{% endblock %}
